<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .banner {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .version {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .description {
            text-align: left;
            background: #1c1c1e;
            padding: 15px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
        }
        .screenshot {
            width: 100%;
            max-width: 300px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Replace this with a link to your actual banner image -->
    <img class="banner" src="https://ssxfien.github.io/assets/banner.png" alt="Limelight Reborn Banner">
    
    <h1>Limelight Reborn</h1>
    <div class="version">Version 1.0 | By ssxfien</div>

    <div class="description">
        <p><strong>Jailbreaking was never meant to be paid.</strong></p>
        <p>A custom neon outline theme pack. This theme brings a vibrant, glowing aesthetic to your iOS device. Packed with custom icons designed to make your springboard pop.</p>
        <p>Requires SnowBoard to apply.</p>
    </div>

    <!-- Replace this with a link to an actual screenshot of your theme -->
    <img class="screenshot" src="https://ssxfien.github.io/assets/screenshot1.png" alt="Theme Screenshot">

</body>
</html>
